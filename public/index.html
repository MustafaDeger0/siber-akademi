</style><link rel="icon" href="/favicon.svg"></head><body><div id="app"></div><dialog id="mission" aria-label="Siber Akademi görev ve ödül ekranı"></dialog><div id="toast" role="status"></div><script>const missions=[
{id:'message',icon:'✉',title:'Mesajın ardındaki sır',area:'Mesaj dedektifliği',desc:'Gelen kutundaki ipuçlarını birleştir. Bu mesaj güvenilir mi?',badge:'Mesaj Dedektifi',xp:120,questions:[
{title:'Bir ödül kazandın… gerçekten mi?',scene:'<div class="fake-message"><b>Gönderen: Ödül Merkezi</b><br>Tebrikler! 5.000 oyun parası kazandın.<br>Ödülün için 10 dakika içinde hesabınla giriş yap!<br><span class="fake-link">oyun-odul.example/giris</span></div>',ask:'Bu mesajdaki hangi iki özellik şüphe uyandırıyor?',options:['Hediye emojisi ve kısa cümleler','Beklenmedik ödül ve aceleyle giriş yapma baskısı','Oyun parasından bahsetmesi'],correct:1,why:'Beklenmedik ödüller ve süre baskısı, düşünmeden bağlantıya tıklamanı sağlamak için kullanılabilir. Mesajdaki bağlantıdan giriş yapmak yerine hizmetin resmî uygulamasını kendin aç.'},
{title:'Göndereni kontrol et',scene:'Görünen ad: Okul Destek<br>Adres: destek@okul-hesap.example<br>Mesaj: “Hesabının kapanmaması için parolanı bize cevap olarak gönder.”',ask:'En güvenli adım hangisi?',options:['Parolayı yalnızca okul adı varsa gönderirim','Mesaja yanıt verip gerçekten okul olup olmadığını sorarım','Parolayı paylaşmam; öğretmenime bildiğim kanaldan sorarım'],correct:2,why:'Görünen ad ve adres tek başına kimliği doğrulamaz. Parola mesajla paylaşılmaz. Şüpheli bir isteği öğretmeninle veya güvendiğin bir yetişkinle bağımsız bir kanaldan doğrula.'},
{title:'Dedektifin son kararı',scene:'Bir arkadaşının hesabından “Bu fotoğraftaki sen misin?” mesajı ve tanımadığın bir bağlantı geldi.',ask:'Arkadaşının adı yazıyor. Şimdi ne yaparsın?',options:['Bağlantıyı açmadan arkadaşıma başka bir kanaldan sorarım','Tanıdığım için hemen açarım','Diğer arkadaşlarıma da iletirim'],correct:0,why:'Tanıdık bir kişinin hesabı da ele geçirilmiş olabilir. Bağlantıyı açmadan başka bir kanaldan kontrol etmek hem seni hem arkadaşlarını korur.'}]},
{id:'account',icon:'⌘',title:'Hesabına bir kalkan kur',area:'Hesap güvenliği',desc:'Parola seçimlerini güçlendir, hesabının kontrolünü koru.',badge:'Hesap Koruyucusu',xp:120,questions:[
{title:'Kurgusal hesabın parolası',scene:'Bu görevde yalnızca örnek parolaları karşılaştırıyoruz. Gerçek parolanı hiçbir alana yazma.',ask:'Bu örnekler arasında hangi yaklaşım daha güvenli?',options:['Ad ve doğum yılı: Deniz2014','Her hesap için farklı, uzun ve tahmin edilmesi zor bir parola','Hatırlamak için bütün hesaplarda aynı parola'],correct:1,why:'Uzunluk, tahmin edilmezlik ve her hesapta farklı parola kullanmak önemlidir. Buradaki örnekleri kendi parolan olarak kullanma. Güvenilir bir parola yöneticisi bu konuda yardımcı olabilir.'},
{title:'İkinci koruma katmanı',scene:'Birisi parolanı öğrenmiş olabilir. Uygulama iki adımlı doğrulama seçeneği sunuyor.',ask:'İki adımlı doğrulama ne işe yarar?',options:['Parolayı herkesin görmesini sağlar','Hesabı bütün risklere karşı tamamen korur','Girişte ek bir doğrulama isteyerek hesabı daha iyi korur'],correct:2,why:'İki adımlı doğrulama, parolaya ek bir koruma katmanı sağlar; bütün riskleri ortadan kaldırmaz. Doğrulama kodları da başkalarıyla paylaşılmaz.'},
{title:'Oyun arkadaşı yardım istiyor',scene:'“Hesabını yükselteceğim. Telefonuna gelen giriş kodunu bana söylemen yeterli!”',ask:'Nasıl cevap verirsin?',options:['Kodu paylaşmam ve bu isteği güvendiğim bir yetişkine bildiririm','Sadece bir kez kullanacağı için gönderirim','Parolamı bilmiyorsa kodu paylaşabilirim'],correct:0,why:'Giriş kodu hesabına erişim sağlayabilir. Arkadaşın, destek görevlisi veya başka biri istese de paylaşma. Yardım için resmî destek kanallarını ve güvendiğin yetişkinleri kullan.'}]},
{id:'privacy',icon:'◈',title:'Dijital izinin kontrolü sende',area:'Gizlilik laboratuvarı',desc:'Neyi, kiminle paylaşacağına bilinçli karar ver.',badge:'Gizlilik Uzmanı',xp:120,questions:[
{title:'Profilini kim görebilir?',scene:'Kurgusal profilinde okulunun adı, doğum tarihin ve günlük antrenman saatlerin görünüyor.',ask:'En uygun düzenleme hangisi?',options:['Daha çok arkadaş için profili herkese açarım','Gereksiz kişisel bilgileri kaldırır, görünürlüğü onayladığım kişilerle sınırlarım','Sadece profil fotoğrafını değiştiririm'],correct:1,why:'Paylaştığın bilgileri azaltmak ve görünürlüğü sınırlamak kontrolünü artırır. Özel hesapta bile paylaşımlar kopyalanabilir; düzenli konum ve günlük rutin gibi bilgileri paylaşmamak daha güvenlidir.'},
{title:'Bu uygulama neden konum istiyor?',scene:'Basit bir el feneri uygulaması, konumuna ve kişilerine sürekli erişim istiyor.',ask:'İzinleri nasıl değerlendirirsin?',options:['Uygulamanın işi için gerekli olup olmadığını kontrol eder, gereksiz izinleri reddederim','Bütün izinleri kabul ederim','Uygulama ücretsizse izinler önemli değildir'],correct:0,why:'İzin, uygulamanın işleviyle ilişkili olmalı. Gereksiz izinleri reddet; uygulama açıklamasını ve ayarlarını güvendiğin bir yetişkinle incele.'},
{title:'Paylaşmadan önce bir dur',scene:'Arkadaşınla çekildiğin fotoğrafta evinin kapı numarası ve arkadaşının yüzü açıkça görünüyor.',ask:'Paylaşmadan önce ne yapmalısın?',options:['Konum etiketini eklemeliyim','Beğeni alacaksa hemen paylaşmalıyım','Arkadaşımın iznini almalı ve adres gibi ayrıntıları gizlemeliyim'],correct:2,why:'Bir fotoğraf başkalarının kişisel bilgilerini de içerebilir. Paylaşım izni almak ve adres gibi ayrıntıları gizlemek hem senin hem arkadaşının gizliliğini korur.'}]}];
const icons=['🧑‍🚀','🥷','🤖','🦊','🐱'];let state={name:'Siber Kaşif',avatar:'🧑‍🚀',done:[],attempts:{},last:'message'};try{const s=JSON.parse(localStorage.getItem('siber-akademi-v1'));if(s&&typeof s==='object')state={...state,...s,done:Array.isArray(s.done)?s.done.filter(x=>missions.some(m=>m.id===x)):[]};}catch{}let page='home',active=null,step=0,selected=null,answered=false;
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let save=()=>{try{localStorage.setItem('siber-akademi-v1',JSON.stringify(state))}catch{}};let xp=()=>state.done.length*120;let level=()=>state.done.length===3?'Siber Koruyucu':state.done.length?'Siber Araştırmacı':'Siber Kaşif';
function render(){const next=missions.find(m=>!state.done.includes(m.id))||missions[0];$('#app').innerHTML=`<aside><div class="brand"><span class="brand-icon">✦</span><div>Siber Akademi<small>DİJİTAL KAHRAMANLAR</small></div></div><div class="nav-label">KONTROL MERKEZİ</div><nav>${[['home','⌂','Akademim'],['missions','▦','Görev haritası'],['badges','◇','Rozetlerim'],['profile','◎','Profilim'],['teacher','▤','Öğretmen görünümü']].map(([id,ico,label])=>`<button data-page="${id}" class="${page===id?'active':''}"><span>${ico}</span>${label}</button>`).join('')}</nav><div class="sidebar-bottom"><span>✦ Küçük adımlar, güçlü kalkanlar.</span><p>Merak et. Kontrol et.<br>Güvende kal.</p></div></aside><main><header><span class="crumb">Akademi / ${page==='home'?'Kontrol merkezi':page==='missions'?'Görev haritası':page==='badges'?'Rozetlerim':page==='teacher'?'Öğretmen görünümü':'Profilim'}</span><div class="profile"><span class="xp-pill">✧ ${xp()} XP</span><span class="avatar">${esc(state.avatar)}</span><div><b>${esc(state.name)}</b><small>${level()}</small></div></div></header>${page==='home'||page==='missions'?dashboard(next):page==='badges'?badges():page==='profile'?profile():teacher()}<p class="footer-note">Siber Akademi · İnteraktif prototip · 5–7. sınıf · İlerlemen bu tarayıcıda saklanır.</p></main>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();window.scrollTo(0,0)});document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));if(page==='profile')bindProfile();}
function dashboard(next){return `<div class="intro"><div><div class="eyebrow">Dijital dünyanın koruyucuları</div><h1>Hoş geldin, ${esc(state.name)} 👋</h1><p>Bugün yeni bir şey keşfet. Dijital dünyada daha güçlü ol.</p></div><span class="tag">Başlangıç akademisi</span></div>${page==='home'?`<section class="hero"><div><span class="eyebrow">SIRADAKİ GÖREVİN</span><h2>${state.done.length===3?'Kalkanın tamamlandı. Keşfetmeye devam et!':'Dijital dünyada süper gücün: farkındalık.'}</h2><p>${state.done.length===3?'Üç uzmanlık rozetini de kazandın. Becerilerini pekiştirmek için görevleri yeniden keşfedebilirsin.':'Her bağlantı göründüğü gibi olmayabilir. İpuçlarını keşfet, doğru kararı ver ve ilk rozetini kazan.'}</p><button class="primary" data-start="${next.id}">${state.done.length===3?'Görevi tekrar keşfet':'Göreve başla'} &nbsp; ✦</button></div><div class="shield-scene" aria-hidden="true"><div class="orbit"></div><div class="big-shield">✓</div><span class="float f1">⌘</span><span class="float f2">✉</span></div></section>`:''}<section class="stats"><div class="stat"><div class="stat-icon">⚑</div><div><b>${state.done.length}<span style="font-size:15px;color:var(--muted)"> / 3</span></b><small>Tamamlanan görev</small></div></div><div class="stat"><div class="stat-icon" style="color:#f4ce80">✧</div><div><b>${xp()}</b><small>Deneyim puanı</small></div></div><div class="stat"><div class="stat-icon" style="color:var(--mint)">◇</div><div><b>${state.done.length}</b><small>Kazanılan rozet</small></div></div></section><div class="columns"><section><div class="section-head"><h2>Görev haritan</h2><span>Kendi rotanı seç</span></div><div class="missions">${missions.map((m,i)=>`<article class="mission-card"><div class="icon" style="${i===1?'color:#f0cd83;background:#f0cd8312':i===2?'color:var(--mint);background:#a1f3ce12':''}">${m.icon}</div><div><h3>${m.title}</h3><p>${m.desc}</p><span class="meta">${state.done.includes(m.id)?'✓ Tamamlandı':'3 adım · Yaklaşık 4 dk'} &nbsp; · &nbsp; ${m.xp} XP</span></div><button class="${state.done.includes(m.id)?'secondary':'primary'}" data-start="${m.id}">${state.done.includes(m.id)?'Tekrar keşfet':'Keşfet'}</button></article>`).join('')}</div></section><div class="right-side"><section class="side-panel"><h2>Koruyucu yolculuğun</h2><p>Üç uzmanlığı keşfet,<br>Siber Koruyucu unvanını kazan.</p><div class="progress"><i style="width:${state.done.length/3*100}%"></i></div><div class="progress-label"><span>${level()}</span><span>${Math.round(state.done.length/3*100)}%</span></div><div class="badges">${missions.map(m=>`<span title="${m.badge}${state.done.includes(m.id)?' · Kazanıldı':' · Henüz kazanılmadı'}" class="badge ${state.done.includes(m.id)?'earned':''}">${m.icon}</span>`).join('')}</div><span style="font-size:12px;color:var(--muted)">${3-state.done.length?`${3-state.done.length} uzmanlık seni bekliyor.`:'Bütün uzmanlıklar tamamlandı!'}</span></section><section class="side-panel"><span class="tip">✦ AKLINDA BULUNSUN</span><p style="color:#d4dced">Bir mesaj acele etmeni istiyorsa, yavaşlamak iyi bir başlangıçtır.</p><span style="font-size:12px;color:var(--muted)">Dur. Düşün. Kontrol et.</span></section></div></div>`}
function badges(){return `<div class="intro"><div><div class="eyebrow">BAŞARILARIN</div><h1>Her rozet bir beceri.</h1><p>Görevlerdeki üç adımı tamamlayarak uzmanlığını göster.</p></div></div><div class="badge-grid">${missions.map(m=>`<article class="badge-card"><div class="badge ${state.done.includes(m.id)?'earned':''}">${m.icon}</div><h3>${m.badge}</h3><p>${m.area} görevindeki üç senaryoyu doğru kararlarla tamamla.</p><button class="${state.done.includes(m.id)?'secondary':'primary'}" data-start="${m.id}">${state.done.includes(m.id)?'✓ Kazanıldı · Tekrar et':'Görevi keşfet'}</button></article>`).join('')}</div>`}
function profile(){return `<div class="intro"><div><div class="eyebrow">SENİN AKADEMİN</div><h1>Kimliğini kendin seç.</h1><p>Gerçek adını kullanmak zorunda değilsin. Bir takma ad yeterli.</p></div></div><section class="side-panel" style="max-width:650px"><h2>Kaşif profili</h2><label for="nickname">Takma adın</label><input id="nickname" maxlength="24" value="${esc(state.name)}"><label>Avatarını seç</label><div class="avatar-options">${icons.map(a=>`<button class="avatar-option ${a===state.avatar?'selected':''}" data-avatar="${a}" aria-label="${a} avatarını seç" aria-pressed="${a===state.avatar}">${a}</button>`).join('')}</div><button class="primary" id="save-profile">Değişiklikleri kaydet</button><p>Seviyen: <b>${level()}</b> · ${xp()} XP</p><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><h3 style="font-size:15px">Yeni bir başlangıç</h3><p>İlerlemeni sıfırlamak, bu tarayıcıdaki görev ve rozet kayıtlarını temizler.</p><button class="secondary" id="reset">İlerlemeyi sıfırla</button></section>`}
function bindProfile(){let chosen=state.avatar;document.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=()=>{chosen=b.dataset.avatar;document.querySelectorAll('[data-avatar]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))})});$('#save-profile').onclick=()=>{state.name=$('#nickname').value.trim()||'Siber Kaşif';state.avatar=chosen;save();render();toast('Profilin güncellendi.')};$('#reset').onclick=()=>{const d=$('#mission');d.innerHTML=`<div class="modal-head"><b>İlerlemeyi sıfırla</b><button aria-label="Kapat" id="close-modal">×</button></div><div class="modal-body"><p>Görevlerin, puanların ve rozetlerin silinecek. Profilin korunacak.</p><div class="modal-actions"><button class="secondary" id="cancel-reset">Vazgeç</button><button class="primary" id="confirm-reset">Evet, sıfırla</button></div></div>`;d.showModal();$('#close-modal').onclick=$('#cancel-reset').onclick=()=>d.close();$('#confirm-reset').onclick=()=>{state.done=[];state.attempts={};save();d.close();render();toast('Yeni yolculuğun hazır.')}}}

function bindIdentity(editing=false){const selected=chooseAvatar(state.avatar);$('#identity-form').onsubmit=async e=>{e.preventDefault();const submit=$('.identity-submit');const username=$('#username').value.trim().normalize('NFKC');if(!/^[a-zA-Z0-9_ÇĞİÖŞÜçğıöşü]{3,20}$/.test(username)){$('#identity-error').textContent='3–20 harf, rakam veya alt çizgi kullan.';return;}submit.disabled=true;submit.textContent='Kaydediliyor…';$('#identity-error').textContent='';try{if(connection.mode==='online'){const r=await apiRequest('/api/profile',{username,avatar:selected()},'PUT');hydratePlayer(r.player);}else{state.name=username;state.avatar=selected();state.registered=true;save()}board.status='idle';page='home';render();toast(editing?'Kaşif kimliğin güncellendi.':'Akademiye hoş geldin, '+state.name+'!')}catch(error){$('#identity-error').textContent=error.message||'Kayıt tamamlanamadı.';submit.disabled=false;submit.textContent=editing?'Kimliğimi güncelle':'Akademiye katıl';}};}
function rankingEntry(p,compact=false){return `<div class="ranking-player ${compact?'compact':''}"><span class="player-face">${portrait(p.avatar)}</span><div><b>${esc(p.username)}${p.is_me?' <span class="you-tag">SEN</span>':''}</b><small>${p.completed} / 3 uzmanlık</small></div></div>`}
function leaderboard(){const loading=board.status==='loading'||board.status==='idle';const sorted=board.players;const podium=[sorted[1],sorted[0],sorted[2]].filter(Boolean);return `<div class="intro"><div><div class="eyebrow">BİRLİKTE YÜKSELİYORUZ</div><h1>Kaşifler ligi</h1><p>Her doğru karar yeni bir adım. Kendi gelişimini de takip et.</p></div><button class="secondary" id="refresh-board" ${loading?'disabled':''}>${loading?'Yükleniyor…':'Sıralamayı yenile'}</button></div><div class="league-banner"><div class="league-art">${emblem('master')}</div><div><h2>Birlikte daha güçlü bir kalkan.</h2><p>Toplam XP sıralaması · ${board.total} kaşif · Eşit puanda tamamlanan görev, ardından katılım sırası.</p></div></div>${connection.mode==='local'?'<section class="side-panel empty"><h2>Ortak sıralama çevrimiçi sürümde açılır.</h2><p>Bu dosyada yalnızca kendi profilini görürsün. Diğer oyuncuların puanları sunucudan gelir.</p></section>':board.status==='error'?`<section class="side-panel empty" role="alert"><h2>Sıralama şu an alınamadı.</h2><p>${esc(board.error)}</p><button class="primary" id="retry-board">Yeniden dene</button></section>`:loading?'<div class="leaderboard-loading" role="status"><span class="spinner"></span> Kaşiflerin puanları getiriliyor…</div>':!sorted.length?'<section class="side-panel empty"><h2>İlk kaşif sen olabilirsin.</h2><p>Profilini oluşturduğunda burada görüneceksin.</p></section>':`${board.mine?`<section class="your-rank"><div><span class="eyebrow">SENİN KONUMUN</span><h2>#${board.mine.rank} <span> / ${board.total} kaşif</span></h2></div>${rankingEntry({...board.mine,is_me:1},true)}<strong>${board.mine.xp} <small>XP</small></strong></section>`:''}<div class="podium">${podium.map(p=>`<article class="podium-card place-${p.rank} ${p.is_me?'is-you':''}"><span class="podium-place">${p.rank===1?'LİGİN ZİRVESİ':'#'+p.rank}</span><div class="podium-avatar">${portrait(p.avatar)}</div><h3>${esc(p.username)} ${p.is_me?'<span class="you-tag">SEN</span>':''}</h3><b>${p.xp} <small>XP</small></b><p>${p.completed} uzmanlık tamamlandı</p></article>`).join('')}</div><section class="side-panel league-table"><div class="section-head"><h2>Kaşif sıralaması</h2><span>İlk 50 oyuncu</span></div><div class="table-wrap"><table><thead><tr><th scope="col">Sıra</th><th scope="col">Kaşif</th><th scope="col">Uzmanlık</th><th scope="col">XP</th></tr></thead><tbody>${sorted.map(p=>`<tr class="${p.is_me?'my-ranking':''}"><td><span class="rank-number rank-${p.rank}">#${p.rank}</span></td><td>${rankingEntry(p)}</td><td>${p.completed} / 3</td><td><strong>${p.xp}</strong></td></tr>`).join('')}</tbody></table></div></section>`}<p class="league-footnote">Sıralamada yalnızca kullanıcı adın, avatarın ve görev puanların görünür. Bir görevin XP ödülü bir kez kazanılır.</p>`}
async function loadBoard(){if(connection.mode!=='online'){board.status='local';return;}board.status='loading';render();try{const r=await apiRequest('/api/leaderboard');board={...r,status:'ready',error:''}}catch(error){board={...board,status:'error',error:error.message}}if(page==='leaderboard')render();}
const previousRender=render;render=function(){
  if(connection.mode==='loading'){$('#app').innerHTML='<div class="identity-shell"><div class="connecting"><span class="spinner"></span><h1>Akademin hazırlanıyor.</h1><p>Kaşif kaydını getiriyoruz…</p></div></div>';return;}
  if(connection.mode==='signin'||connection.mode==='error'){$('#app').innerHTML=`<div class="identity-shell"><section class="identity-card welcome-card"><div class="welcome-emblem">${emblem('master')}</div><div class="eyebrow">SİBER AKADEMİ</div><h1>Dijital dünyanın koruyucusu ol.</h1><p>Avatarını seç, görevleri keşfet, rozetlerini topla. Kendi kullanıcı adınla kaşifler ligine katıl.</p>${connection.mode==='signin'?'<a class="primary signin-link" target="_top" href="/signin-with-chatgpt?return_to=%2F">ChatGPT ile devam et</a><small>Girişten sonra kendi kullanıcı adını oluşturacaksın.</small>':`<p class="form-error" role="alert">${esc(connection.error)}</p><button class="primary" id="retry-connection">Yeniden bağlan</button>`}</section></div>`;if($('#retry-connection'))$('#retry-connection').onclick=bootstrap;return;}
  if((connection.mode==='online'&&!connection.player)||(connection.mode==='local'&&!state.registered)){$('#app').innerHTML=`<div class="identity-shell"><div class="identity-brand">Siber Akademi <span>DİJİTAL KAHRAMANLAR</span></div>${identityForm()}</div>`;bindIdentity();return;}
  previousRender();const nav=document.querySelector('nav');const b=document.createElement('button');b.innerHTML='<span>♜</span> Kaşifler ligi';b.dataset.page='leaderboard';b.className=page==='leaderboard'?'active':'';b.onclick=()=>{page='leaderboard';render();window.scrollTo(0,0);if(board.status==='idle')loadBoard()};nav.insertBefore(b,nav.children[2]);
  const teacherButton=document.querySelector('[data-page="teacher"]');if(teacherButton)teacherButton.innerHTML='<span>▤</span> Gelişimim';
  const note=$('.footer-note');if(note)note.textContent=connection.mode==='online'?'Siber Akademi · İlerlemen bu tarayıcıdaki kimliğine kaydedilir · Birlikte keşfet, güvenle yüksel.':'Siber Akademi · Yerel deneme · Çevrimiçi sıralama için sunucu bağlantısı gerekir.';
  const pill=$('.xp-pill');if(pill)pill.insertAdjacentHTML('beforebegin',`<span class="connection-status"><i></i>${connection.mode==='online'?'Çevrimiçi':'Yerel deneme'}</span>`);
  if(page==='leaderboard'){const main=document.querySelector('main');const header=main.querySelector('header').outerHTML;main.innerHTML=header+leaderboard();const refresh=$('#refresh-board');if(refresh)refresh.onclick=loadBoard;const retry=$('#retry-board');if(retry)retry.onclick=loadBoard;const crumb=$('.crumb');if(crumb)crumb.textContent='Akademi / Kaşifler ligi';}
  if(page==='profile'){const main=document.querySelector('main');const header=main.querySelector('header').outerHTML;main.innerHTML=header+'<div class="profile-identity">'+identityForm(true)+`<section class="side-panel account-summary"><h2>Kaşif kartın</h2><div class="account-emblem">${emblem(state.done.length===3?'master':'spark')}</div><strong>${xp()} XP</strong><p>${level()}<br>${state.done.length} / 3 uzmanlık tamamlandı</p><button class="secondary" id="view-league">Ligime göz at</button>${connection.mode==='online'?'<small class="signout-link">Keşif kimliğin bu tarayıcıda saklanır. Çerezleri silersen yeni bir kimlikle başlarsın.</small>':''}</section></div>`;bindIdentity(true);$('#view-league').onclick=()=>{page='leaderboard';render();if(board.status==='idle')loadBoard()};}
  if(page==='teacher'){const h=document.querySelector('h1');if(h)h.textContent='Her keşifte biraz daha güçlüsün.';const p=$('.intro p');if(p)p.textContent='Kendi görevlerini ve cevap denemelerini burada takip edebilirsin.';const eyebrow=$('.intro .eyebrow');if(eyebrow)eyebrow.textContent='KİŞİSEL GELİŞİMİN';}
};
const localStart=start,localCheck=check,localComplete=complete;
start=async function(id){if(connection.mode!=='online'){localStart(id);return;}if(networkBusy)return;networkBusy=true;try{const r=await apiRequest('/api/game',{type:'start',mission:id});hydratePlayer(r.player);serverRun=r.player.run.id;localStart(id)}catch(e){toast(e.message)}finally{networkBusy=false}};
function connectionError(error){const feedback=$('#feedback');if($('#mission').open&&feedback)feedback.insertAdjacentHTML('beforeend',`<div class="feedback retry" role="alert">${esc(error.message)} Kararın kaybolmadı; tekrar deneyebilirsin.</div>`);else toast(error.message)}
check=async function(){if(connection.mode!=='online'){localCheck();return;}if(networkBusy||answered||selected===null)return;networkBusy=true;const choice=selected;const checkButton=$('#check');checkButton.disabled=true;document.querySelectorAll('[data-option]').forEach(b=>b.disabled=true);try{const r=await apiRequest('/api/game',{type:'answer',runId:serverRun,step,option:choice});selected=choice;localCheck();hydratePlayer(r.player);board.status='idle';render();if(!answered)document.querySelectorAll('[data-option]').forEach(b=>b.disabled=false);}catch(e){connectionError(e);document.querySelectorAll('[data-option]').forEach(b=>b.disabled=false);if(checkButton.isConnected)checkButton.disabled=false;}finally{networkBusy=false}};
complete=async function(){if(connection.mode!=='online'){localComplete();return;}if(networkBusy)return;networkBusy=true;const button=$('#check');if(button)button.disabled=true;try{const r=await apiRequest('/api/game',{type:'complete',runId:serverRun});localComplete();hydratePlayer(r.player);board.status='idle';render();}catch(e){connectionError(e);if(button?.isConnected)button.disabled=false}finally{networkBusy=false}};
async function bootstrap(){if(location.protocol==='file:'){connection.mode='local';render();return;}connection.mode='loading';render();try{const r=await apiRequest('/api/me');connection.mode='online';connection.player=r.player;if(r.player)hydratePlayer(r.player);else{state={name:'',avatar:'pilot',done:[],attempts:{}};rewards={claimed:[],bonus:[],daily:{},total:0}}render()}catch(e){connection.mode=e.status===401?'signin':'error';connection.error=e.message||'Bağlantı kurulamadı.';render()}}
bootstrap();

</script></body></html>
