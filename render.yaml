services:
  - type: web
    name: siber-akademi
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.15.0
      - key: DATABASE_URL
        fromDatabase:
          name: siber-akademi-db
          property: connectionString
databases:
  - name: siber-akademi-db
    plan: free
    region: frankfurt
    postgresMajorVersion: '17'
    ipAllowList: []
